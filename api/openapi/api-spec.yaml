openapi: 3.0.3
info:
  title: LawDocs API Gateway
  version: 1.0.0
  description: Unified API gateway for LawDocs platform with Telegram WebApp authentication
  contact:
    name: LawDocs Support
    email: support@lawdocs.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8085
    description: Local development server
  - url: https://api.lawdocs.com
    description: Production server

paths:
  /api/v1/auth/telegram:
    post:
      tags: [ Auth ]
      summary: Authenticate via Telegram WebApp
      description: |
        Authenticate user using Telegram WebApp initData.
        This endpoint validates Telegram initData and returns JWT tokens.
      operationId: authenticateTelegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        description: Telegram WebApp initialization data
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid Telegram initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/v1/auth/register:
    post:
      tags: [ Auth ]
      summary: Register a new user (traditional)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags: [ Auth ]
      summary: Authenticate user (traditional)
      operationId: authenticateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [ Auth ]
      summary: Refresh JWT token
      description: Get new access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      summary: Logout user
      description: Invalidate user's refresh token
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/validate:
    post:
      tags: [ Auth ]
      summary: Validate JWT token
      description: Validate access token without invalidating it
      operationId: validateToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication endpoints.
        Format: `Bearer <token>`

  schemas:
    # Telegram Authentication
    TelegramAuthRequest:
      type: object
      required: [ initData ]
      properties:
        initData:
          type: string
          description: |
            Telegram WebApp initialization data.
            Format: `query_id=...&user=...&auth_date=...&hash=...`
          example: "query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A123456789%2C%22first_name%22%3A%22John%22%2C%22last_name%22%3A%22Doe%22%2C%22username%22%3A%22johndoe%22%2C%22language_code%22%3A%22en%22%7D&auth_date=1653000000&hash=abc123def456...789"
      description: Request for Telegram WebApp authentication

    TelegramAuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token for API calls
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token for obtaining new access tokens
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          description: Type of the token (always "Bearer")
          example: "Bearer"
          default: "Bearer"
        userId:
          type: integer
          format: int64
          description: Internal user ID in LawDocs system
          example: 123
        telegramId:
          type: string
          description: Telegram user ID
          example: "123456789"
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 3600
      description: Response for successful Telegram authentication

    # Traditional Authentication
    Role:
      type: string
      enum: [ USER, ADMIN, MODERATOR ]
      description: User role in the system
      example: "USER"

    RegisterRequest:
      type: object
      required: [ email, password, firstname, lastname ]
      properties:
        role:
          $ref: '#/components/schemas/Role'
          default: USER
        email:
          type: string
          format: email
          description: User's email address
          example: "user@example.com"
        password:
          type: string
          format: password
          description: User's password (min 8 characters)
          example: "password123"
          minLength: 8
        firstname:
          type: string
          description: User's first name
          example: "John"
        lastname:
          type: string
          description: User's last name
          example: "Doe"
        phone:
          type: string
          description: User's phone number (optional)
          example: "+1234567890"
      description: Request for user registration

    AuthenticationRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: "user@example.com"
        password:
          type: string
          format: password
          description: User's password
          example: "password123"
      description: Request for user authentication

    AuthenticationResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          description: Type of the token
          example: "Bearer"
          default: "Bearer"
        userId:
          type: integer
          format: int64
          description: User ID
          example: 123
        expiresIn:
          type: integer
          description: Token expiration in seconds
          example: 3600
      description: Response for successful authentication

    # Token Management
    RefreshTokenRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: Refresh token obtained during authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      description: Request for refreshing access token

    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: New JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: New refresh token (rotated)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          example: "Bearer"
          default: "Bearer"
        expiresIn:
          type: integer
          example: 3600
      description: Response for token refresh

    TokenValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the token is valid
          example: true
        userId:
          type: integer
          format: int64
          description: User ID from the token
          example: 123
        role:
          $ref: '#/components/schemas/Role'
          description: User role from the token
        expiresAt:
          type: string
          format: date-time
          description: Token expiration timestamp
          example: "2024-12-31T23:59:59Z"
      description: Response for token validation

    # Error Responses
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: "Invalid request parameters"
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: "2024-01-15T10:30:00Z"
        path:
          type: string
          description: Request path
          example: "/api/v1/auth/telegram"
      required: [ statusCode, message ]
      description: Generic error response

    ValidationErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 422
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "initData"
              message:
                type: string
                example: "Telegram hash validation failed"
          description: List of validation errors
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      required: [ statusCode, message, errors ]
      description: Validation error response

    # Common Models
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        email:
          type: string
          format: email
          example: "user@example.com"
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        role:
          $ref: '#/components/schemas/Role'
        telegramId:
          type: string
          example: "123456789"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
      description: User profile information

  responses:
    BadRequest:
      description: Invalid input or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication failed or token is invalid/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict (e.g., user already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    UserIdPathParam:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: User ID
      example: 123

    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer token for authentication
      example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

tags:
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Users
    description: User management endpoints
  - name: Files
    description: File storage and management endpoints
  - name: Documents
    description: Document generation and processing endpoints
  - name: AI
    description: AI consultation and processing endpoints

externalDocs:
  description: Find more info about LawDocs API
  url: https://docs.lawdocs.com/api