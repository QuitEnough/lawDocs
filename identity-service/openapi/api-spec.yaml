openapi: 3.0.3
info:
  title: User Service API
  description: API for user registration, authentication, and password management
  version: 1.0.0
tags:
  - name: Authentication
    description: API endpoints for user registration, login, and password management
servers:
  - url: http://localhost:8084
    description: Local development server
paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /authenticate:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      operationId: authenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /change-password:
    patch:
      tags:
        - Authentication
      summary: Change user password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /delete-account:
    delete:
      tags:
        - Authentication
      summary: Delete current user account (by JWT)
      operationId: deleteAccount
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: Account deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /telegram:
    post:
      tags: [ Authentication ]
      summary: Authenticate via Telegram WebApp
      description: Validates Telegram initData and returns JWT tokens
      operationId: authenticateTelegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramAuthResponse'
        '401':
          description: Invalid Telegram data
        '422':
          description: Validation error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
      required:
        - role
        - email
        - password
        - firstname
        - lastname

    AuthenticationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          example: "currentPassword123"
        newPassword:
          type: string
          format: password
          example: "newPassword123"
        confirmationPassword:
          type: string
          format: password
          example: "newPassword123"
      required:
        - currentPassword
        - newPassword
        - confirmationPassword

    AuthenticationResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "refreshToken123456789"
        tokenType:
          type: string
          example: "Bearer"
        userId:
          type: integer
          format: int64

    Role:
      type: string
      enum:
        - USER
        - ADMIN
      example: "USER"

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid input"
      required:
        - statusCode
        - message

    TelegramAuthRequest:
      type: object
      required: [ initData ]
      properties:
        initData:
          type: string
          description: |
            Telegram WebApp initialization data.
            Format: `query_id=...&user=...&auth_date=...&hash=...`
          example: "query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A123456789%2C%22first_name%22%3A%22John%22%2C%22last_name%22%3A%22Doe%22%2C%22username%22%3A%22johndoe%22%2C%22language_code%22%3A%22en%22%7D&auth_date=1653000000&hash=abc123def456...789"
      description: Request for Telegram WebApp authentication

    TelegramAuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token for API calls
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token for obtaining new access tokens
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          description: Type of the token (always "Bearer")
          example: "Bearer"
          default: "Bearer"
        userId:
          type: integer
          format: int64
          description: Internal user ID in LawDocs system
          example: 123
        telegramId:
          type: string
          description: Telegram user ID
          example: "123456789"
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 3600
      description: Response for successful Telegram authentication